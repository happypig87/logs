<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 綠畜模擬器 - 郵務人生 </title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            width: 100%;
            max-width: 750px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-weight: bold; font-size: 18px; margin-top: 4px; }
        
        .rank-poor { color: #f44336; }
        .rank-below { color: #ff9800; }
        .rank-avg { color: #ffeb3b; }
        .rank-above { color: #8bc34a; }
        .rank-elite { color: #00e676; }

        .finance-bar {
            display: flex;
            justify-content: space-between;
            background: #252525;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .phase-indicator {
            background: #2196f3;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        #story-text {
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            margin-bottom: 20px;
            background: #252525;
            padding: 15px;
            border-left: 4px solid #2196f3;
            border-radius: 4px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button.option-btn {
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button.option-btn:hover {
            background: #3a3a3a;
            border-color: #2196f3;
            transform: translateY(-2px);
        }
        .chance-badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 10px;
            white-space: nowrap;
        }
        .chance-high { background: #1b5e20; color: #81c784; }
        .chance-med { background: #e65100; color: #ffb74d; }
        .chance-low { background: #b71c1c; color: #e57373; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #bbb; }
        input[type="text"], select {
            width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 6px; color: #fff; font-size: 16px; box-sizing: border-box;
        }
        input[type="range"] { width: 100%; accent-color: #2196f3; }
        .start-btn {
            width: 100%; background: #2196f3; text-align: center; font-weight: bold;
            font-size: 18px; margin-top: 10px; padding: 14px; border: none; border-radius: 6px; color: #fff; cursor: pointer;
        }
        .start-btn:hover { background: #1976d2; }
        #log {
            margin-top: 20px; font-size: 13px; color: #aaa; max-height: 140px;
            overflow-y: auto; border-top: 1px solid #333; padding-top: 10px; line-height: 1.5;
        }
        .hidden { display: none !important; }
        .log-success { color: #81c784; }
        .log-fail { color: #e57373; }
        .age-warning { color: #f44336; font-size: 12px; margin-top: 4px; display: none; }
        
        .bad-habit-tag {
            background-color: #b71c1c;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div id="game-card">
    <div id="setup-screen">
        <h2 style="margin-top:0; text-align:center;">📋 郵務人員入職登記</h2>
        <p style="color:#aaa; text-align:center; font-size:14px; margin-bottom: 25px;">恭喜你成為了一名新科郵務士，你的職階為專業職二-外勤。</p>
        
        <div class="form-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" placeholder="請輸入姓名" value="陳大天">
        </div>

        <div class="form-group">
            <label for="start-age">入職年齡：<span id="age-val" style="color:#ffeb3b; font-weight:bold; font-size:18px;">22</span> 歲</label>
            <input type="range" id="start-age" min="18" max="50" value="22" oninput="onAgeChange(this.value)">
            <div id="age-cap-tip" class="age-warning">⚠️ 入職年齡超過 40 歲：體力最高上限受限為 60 分。</div>
        </div>

        <div class="form-group">
            <label for="dept-select">選擇分發部門：</label>
            <select id="dept-select">
                <option value="混投部門">混投部門 (平信/掛號/小包裹，無配發手機，機車投遞)</option>
                <option value="快包部門">快包部門 (大件包裹/急件快捷，配發公務手機，汽車投遞)</option>
            </select>
        </div>

        <button class="start-btn" onclick="startGame()">正式報到入職</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header">
            <div>
                <h2 style="margin:0; font-size: 20px;">
                    <span id="display-title">郵務士</span> <span id="display-name">陳大天</span>
                    <span id="bad-habit-display"></span>
                </h2>
                <span id="display-career" style="font-size:12px; color:#aaa;">年資第 1 年 | 部門：混投部門</span>
            </div>
            <div><span id="age" style="font-size: 22px; color:#ffeb3b;">18</span> 歲 (退休倒數 <span id="years-left">--</span> 年)</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">體力<span id="stamina" class="stat-val">50</span></div>
            <div class="stat-box">情商<span id="eq" class="stat-val">50</span></div>
            <div class="stat-box">職場聲望<span id="reputation" class="stat-val">50</span></div>
            <div class="stat-box">應變能力<span id="adaptability" class="stat-val">50</span></div>
            <div class="stat-box">工作評價<span id="performance" class="stat-val">50</span></div>
        </div>

        <div class="finance-bar">
            <div>本年薪資：<span id="salary-display" style="color:#ffc107; font-weight:bold;">76 萬</span></div>
            <div>累積淨資產：<span id="money" style="color:#4caf50; font-weight:bold;">$0 萬</span></div>
        </div>

        <div>
            <span id="phase-tag" class="phase-indicator">階段 1/3：投遞日常事件</span>
        </div>

        <div id="story-text">載入中...</div>

        <div id="options" class="options-container"></div>

        <div id="log">--- 履歷日誌 ---</div>
    </div>
</div>

<script>
let player = {
    name: "",
    title: "郵務士",
    dept: "混投部門", // 混投部門 或 快包部門
    age: 18, 
    startAge: 18, 
    retireAge: 65,
    stamina: 50, eq: 50, reputation: 50, adaptability: 50, performance: 50,
    money: 0,
    maxStaminaCap: 80,
    currentPhase: 1, // 1: 投遞問題, 2: 職場互動, 3: 生涯意外
    badHabit: null, // "抽菸", "吃檳榔" 或 null
    badHabitExpense: 0,
    hasBeenProxyInspector: false,
    isInspector: false,
    refusedPromotion: false // 若哭求外勤留任後，不再詢問升等考試
};

const salaryTable = {
    1: 76, 2: 84, 3: 86, 4: 88, 5: 90, 6: 94, 7: 94, 8: 99, 9: 101, 10: 103,
    11: 106, 12: 107, 13: 109, 14: 110, 15: 111, 16: 113, 17: 115
};

function calculateSalary(serviceYear) {
    let salaryInWan = serviceYear <= 17 ? salaryTable[serviceYear] : ((serviceYear - 18) % 5 + 1 === 5 ? 128 : 121);
    if (player.isInspector) {
        salaryInWan += 6; // 郵務稽查每年加薪6萬
    }
    return { amount: salaryInWan * 10000, displayWan: salaryInWan, statusTag: `年資第 ${serviceYear} 年` };
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getRankClass(val) {
    if (val >= 80) return 'rank-elite';
    if (val >= 65) return 'rank-above';
    if (val >= 45) return 'rank-avg';
    if (val >= 25) return 'rank-below';
    return 'rank-poor';
}

function onAgeChange(val) {
    document.getElementById('age-val').innerText = val;
    document.getElementById('age-cap-tip').style.display = parseInt(val) > 40 ? 'block' : 'none';
}

// ================= 事件庫 =================

    rookie: [

// ================= 遊戲核心邏輯 =================

function startGame() {
    let nameInput = document.getElementById('player-name').value.trim();
    if (!nameInput) { alert("請輸入姓名！"); return; }
    
    player.name = nameInput;
    player.startAge = parseInt(document.getElementById('start-age').value);
    player.age = player.startAge;
    player.dept = document.getElementById('dept-select').value;
    
    if (player.startAge > 40) {
        player.maxStaminaCap = 60;
        player.stamina = Math.min(player.stamina, 60);
    }

    // 入職抽取不良嗜好
    let rand = Math.random();
    if (rand < 0.30) {
        player.badHabit = "抽菸";
        player.badHabitExpense = 36000;
        player.stamina -= 5;
    } else if (rand < 0.40) { // 30% + 10%
        player.badHabit = "吃檳榔";
        player.badHabitExpense = 60000;
        player.stamina -= 8;
    }

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    updateUI();
    addLog(`📋 ${player.name} 正式報到入職郵務機構，分發至【${player.dept}】！`, true);
    if (player.badHabit) {
        addLog(`⚠️ 入職擁有不良嗜好：【${player.badHabit}】(體力扣減，每年增加支出 $${player.badHabitExpense/10000} 萬)`, false);
    }

    startYearTurn();
}

function updateUI() {
    document.getElementById('display-name').innerText = player.name;
    document.getElementById('display-title').innerText = player.title;
    document.getElementById('display-career').innerText = `年資第 ${player.age - player.startAge + 1} 年 | 部門：${player.dept}`;
    document.getElementById('age').innerText = player.age;
    document.getElementById('years-left').innerText = player.retireAge - player.age;
    document.getElementById('money').innerText = `$${(player.money / 10000).toFixed(1)} 萬`;

    let habitDisplay = document.getElementById('bad-habit-display');
    if (player.badHabit) {
        habitDisplay.innerHTML = `<span class="bad-habit-tag">${player.badHabit}</span>`;
    } else {
        habitDisplay.innerHTML = "";
    }

    let salInfo = calculateSalary(player.age - player.startAge + 1);
    document.getElementById('salary-display').innerText = `${salInfo.displayWan} 萬`;

    ['stamina', 'eq', 'reputation', 'adaptability', 'performance'].forEach(stat => {
        const el = document.getElementById(stat);
        el.innerText = player[stat];
        el.className = `stat-val ${getRankClass(player[stat])}`;
    });
}

function addLog(text, isSuccess = true) {
    const logBox = document.getElementById('log');
    const newEntry = document.createElement('div');
    newEntry.className = isSuccess ? 'log-success' : 'log-fail';
    newEntry.innerText = text;
    logBox.prepend(newEntry);
}

// 檢查是否有數值觸發最低值結局 (<= 0)
function checkGameOver() {
    if (player.stamina <= 0) {
        triggerEnding("失能或死亡", `身體狀況惡化至極限，體力歸零。因公過勞失能或不幸殉職...`);
        return true;
    }
    if (player.eq <= 0 || player.reputation <= 0 || player.adaptability <= 0 || player.performance <= 0) {
        let lowestStat = "";
        if (player.eq <= 0) lowestStat = "情商歸零，職場人際關係徹底破裂";
        else if (player.reputation <= 0) lowestStat = "職場聲望掃地，陷入嚴重道德聲譽危機";
        else if (player.adaptability <= 0) lowestStat = "應變能力不足，無法適應現代郵務工作";
        else if (player.performance <= 0) lowestStat = "工作評價極度低下，考績連續不及格";

        triggerEnding("解職結局", `由於${lowestStat}，你被迫遞交辭呈，結束了投遞人生！`);
        return true;
    }
    if (player.age >= player.retireAge) {
        triggerEnding("榮退結局", `恭喜順利服役至 65 歲屆齡退休！`);
        return true;
    }
    return false;
}

function triggerEnding(endingType, reasonText) {
    let serviceYears = player.age - player.startAge + 1;
    let avgStat = Math.round((player.stamina + player.eq + player.reputation + player.adaptability + player.performance) / 5);

    document.getElementById('options').innerHTML = '';
    document.getElementById('phase-tag').innerText = "遊戲結束";
    document.getElementById('story-text').innerHTML = `
        <h3 style="color:#ffeb3b; margin-top:0;">🏁 生涯結局：【${endingType}】</h3>
        <strong>${player.name} ${player.title}</strong><br>
        ${reasonText}<br><br>
        📌 最終生涯統計：<br>
        • 服役年資：${serviceYears} 年<br>
        • 最終職銜：${player.title}<br>
        • 累積淨資產：$${(player.money / 10000).toFixed(1)} 萬元<br>
        • 最終五維平均：<strong class="${getRankClass(avgStat)}">${avgStat} 分</strong>
    `;
}

// 開始新的一年
function startYearTurn() {
    if (checkGameOver()) return;

    let serviceYear = player.age - player.startAge + 1;

    // 計算每年財務 (扣除基本生活費15萬 & 不良嗜好費用)
    let sal = calculateSalary(serviceYear).amount;
    let livingExpense = 150000;
    let extraExpense = player.badHabit ? player.badHabitExpense : 0;
    let netSavings = sal - livingExpense - extraExpense;
    player.money += netSavings;

    let note = `(扣除基本生活費15萬`;
    if (extraExpense > 0) note += `及${player.badHabit}開銷${extraExpense/10000}萬`;
    note += `)`;
    addLog(`📅 年資第 ${serviceYear} 年結算：年薪 $${sal/10000}萬，淨存入 $${netSavings/10000}萬 ${note}。`);

    updateUI();

    // 特殊劇情檢查順序：
    // 1. 代理稽查/補缺稽查 檢查
    if (checkInspectorPromotions(serviceYear)) return;

    // 2. 升等考試 檢查 (年資>3年，每三年問一次)
    if (!player.refusedPromotion && serviceYear > 3 && (serviceYear - 3) % 3 === 0) {
        triggerExamEvent();
        return;
    }

    // 3. 常規事件三階段
    player.currentPhase = 1;
    loadPhaseEvent();
}

// 載入階段事件
function loadPhaseEvent() {
    if (checkGameOver()) return;

    let serviceYear = player.age - player.startAge + 1;

    document.getElementById('phase-tag').innerText = `階段 ${player.currentPhase}/3：${
        player.currentPhase === 1 ? '日常投遞事件' : player.currentPhase === 2 ? '職場互動事件' : '生涯意外事件'
    }`;

    let eventPool = [];

    // 根據階段與條件組合事件庫
    if (player.currentPhase === 1) {
        eventPool = [...eventDatabase.delivery];
        if (player.dept === "混投部門") eventPool.push(...eventDatabase.dept_mixed);
        if (player.dept === "快包部門") eventPool.push(...eventDatabase.dept_express);
        if (serviceYear <= 3) eventPool.push(...eventDatabase.rookie);
        if (player.age >= 50) eventPool.push(...eventDatabase.veteran);
    } else if (player.currentPhase === 2) {
        eventPool = [...eventDatabase.workplace];
        // 有不良嗜好時機率觸發不良嗜好事件
        if (player.badHabit && Math.random() < 0.5) {
            eventPool.push(...eventDatabase.badHabitEvents);
        }
    } else {
        eventPool = [...eventDatabase.career];
    }

    let selectedEvent = eventPool[getRandomInt(0, eventPool.length - 1)];
    renderEvent(selectedEvent);
}

function renderEvent(evt) {
    document.getElementById('story-text').innerHTML = `<strong>【${evt.title}】</strong><br>${evt.desc}`;
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    evt.options.forEach((opt) => {
        let chance = opt.baseChance;
        if (opt.statCheck) {
            chance += Math.round((player[opt.statCheck] - 50) * 0.5);
        }
        chance = Math.max(10, Math.min(95, chance));

        let badgeClass = chance >= 70 ? 'chance-high' : chance >= 40 ? 'chance-med' : 'chance-low';

        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
            <span>${opt.text}</span>
            <span class="chance-badge ${badgeClass}">成功率 ${chance}%</span>
        `;
        btn.onclick = () => handleOptionClick(opt, chance);
        optionsContainer.appendChild(btn);
    });
}

function handleOptionClick(opt, chance) {
    let isSuccess = Math.random() * 100 < chance;
    let result = isSuccess ? opt.success : opt.fail;

    // 處理屬性變更
    if (result.effect) {
        for (let stat in result.effect) {
            if (stat === 'money') {
                player.money += result.effect[stat];
            } else {
                player[stat] += result.effect[stat];
                if (stat === 'stamina') player.stamina = Math.min(player.stamina, player.maxStaminaCap);
            }
        }
    }

    // 處理戒煙/戒檳榔
    if (result.isQuit) {
        player.badHabit = null;
        player.badHabitExpense = 0;
    }

    addLog(result.log, isSuccess);
    updateUI();

    if (checkGameOver()) return;

    // 推進階段
    if (player.currentPhase < 3) {
        player.currentPhase++;
        loadPhaseEvent();
    } else {
        // 完成一年
        player.age++;
        startYearTurn();
    }
}

// ================= 主管詢問代理稽查與升任郵務稽查 =================
function checkInspectorPromotions(serviceYear) {
    // 條件4：年資超過5年，應變與評價>60觸發代理稽查
    if (!player.hasBeenProxyInspector && serviceYear > 5 && player.adaptability > 60 && player.performance > 60) {
        renderCustomEvent(
            "主管的面談詢問：代理稽查",
            "由於你工作表現優異且應變能力極佳，主管親自找你面談，詢問你是否願意擔任「代理稽查」協助分擔管理業務...",
            [
                {
                    text: "【願意】接受挑戰，擔任代理稽查",
                    action: () => {
                        player.hasBeenProxyInspector = true;
                        player.reputation += 8;
                        player.performance += 5;
                        addLog("✅ 你接受了主管的提拔，正式成為代理稽查，職場聲望大幅提升！", true);
                        updateUI();
                        player.currentPhase = 1; loadPhaseEvent();
                    }
                },
                {
                    text: "【婉拒】只想專心做外勤投遞工作",
                    action: () => {
                        addLog("ℹ️ 你婉拒了主管的好意，繼續維持現狀。", true);
                        player.currentPhase = 1; loadPhaseEvent();
                    }
                }
            ]
        );
        return true;
    }

    // 條件4：擔任過代理稽查且年資超過十年，觸發補缺退休稽查
    if (player.hasBeenProxyInspector && !player.isInspector && serviceYear > 10) {
        renderCustomEvent(
            "局內職缺異動：退休稽查遺缺",
            "局裡資深稽查屆齡退休留下遺缺，主管考量你曾任代理稽查且經驗豐富，詢問你是否願意補上缺額正式升任郵務稽查？",
            [
                {
                    text: "【願意】正式升任郵務稽查 (每年薪資增加6萬)",
                    action: () => {
                        player.isInspector = true;
                        player.title = "郵務稽查";
                        player.reputation += 15;
                        addLog("🎉 恭喜！你正式升任為【郵務稽查】，每年薪資基礎增加 6 萬元！", true);
                        updateUI();
                        player.currentPhase = 1; loadPhaseEvent();
                    }
                },
                {
                    text: "【婉拒】習慣投遞生活，婉拒升任",
                    action: () => {
                        addLog("ℹ️ 你選擇放棄升任郵務稽查的機會。", true);
                        player.currentPhase = 1; loadPhaseEvent();
                    }
                }
            ]
        );
        return true;
    }

    return false;
}

function triggerExamEvent() {
    renderCustomEvent(
        "📝 三年一度：升等考試意願詢問",
        "又到了三年一度的升等考試報名期，考取後可轉任內勤或更高職階，請問是否報名參加本次升等考試？",

                text: "【參加】報名參加升等考試",
                action: () => startExamProcess()
            },
            {
                text: "【放棄】不參加，繼續外勤工作",
                action: () => {
                    addLog("ℹ️ 你選擇不參加本次升等考試。", true);
                    player.currentPhase = 1; loadPhaseEvent();
                }
            }
        ]
    );
}

function startExamProcess() {
    let isUnder40 = player.age < 40;
    let title = isUnder40 ? "升等考試 (40歲以下組)" : "升等考試 (40歲以上組)";
    let desc = isUnder40 
        ? "作為年輕郵務士，這是衝刺職涯的重要轉折點！請選擇你的準備策略：" 
        : "面對升等考試，雖然體力與記憶力不如當年，但豐富經驗是你的武器！請選擇策略：";

    let options = [];

    if (isUnder40) {
        options = [
            { text: "1. 認真準備 (機率高)", type: "認真", baseChance: 75 },
            { text: "2. 佛系讀書 (機率中)", type: "佛系", baseChance: 45 },
            { text: "3. 去吃便當 (放棄考試)", type: "便當", baseChance: 0 }
        ];
    } else {
        options = [
            { text: "1. 最後一搏 (機率中高)", type: "博", baseChance: 65 },
            { text: "2. 鼓勵後輩 (機率低)", type: "鼓勵", baseChance: 35 },
            { text: "3. 去吃便當 (放棄考試)", type: "便當", baseChance: 0 }
        ];
    }

    let customOptions = options.map(opt => {
        if (opt.type === "便當") {
            return {
                text: opt.text,
                action: () => {
                    addLog("🍱 你選擇去考場吃便當，輕鬆度過了一天。", true);
                    player.currentPhase = 1; loadPhaseEvent();
                }
            };
        }

        // 計算成功率 (根據五維平均)
        let avgStat = Math.round((player.stamina + player.eq + player.reputation + player.adaptability + player.performance) / 5);
        let chance = opt.baseChance + Math.round((avgStat - 50) * 0.4);
        chance = Math.max(15, Math.min(90, chance));

        return {
            text: `${opt.text} (成功率 ${chance}%)`,
            action: () => processExamResult(isUnder40, chance)
        };
    });

    renderCustomEvent(title, desc, customOptions);
}

function processExamResult(isUnder40, chance) {
    let isSuccess = Math.random() * 100 < chance;

    if (isSuccess) {
        if (isUnder40) {
            triggerEnding("升等成功結局", `恭喜你在40歲前通過升等考試！成功轉任內勤管理職階，開啟全新職涯高峰！`);
        } else {
            // 40歲以上成功，檢查適應不良條件：若應變能力或工作評價低於50
            if (player.adaptability < 50 || player.performance < 50) {
                renderCustomEvent(
                    "內勤生活適應不良...",
                    "雖然你成功通過升等考試轉任內勤，但由於應變能力或工作評價較低，你極度不適應繁瑣的內勤公文生活... 最終你決定回頭哭求外勤主管收留你！",
                    [
                        {
                            text: "返回外勤繼續遊戲 (不再詢問升等考試)",
                            action: () => {
                                player.refusedPromotion = true;
                                addLog("⚠️ 你因適應不良回頭哭求外勤主管收留，重新回到外勤崗位，日後不再參加升等考試。", false);
                                updateUI();
                                player.currentPhase = 1; loadPhaseEvent();
                            }
                        }
                    ]
                );
            } else {
                triggerEnding("升等成功結局", `恭喜你在40歲後憑藉豐富資歷與優異能力通過升等考試！順利轉任內勤，雖然你一再推辭擔任主管的機會，並在工作崗位上閃閃躲躲，但這才是你想要的人生！`);
            }
        }
    } else {
        addLog("❌ 升等考試不幸落榜，繼續留在外勤崗位奮鬥。", false);
        player.currentPhase = 1; loadPhaseEvent();
    }
}

function renderCustomEvent(title, desc, optionsArray) {
    document.getElementById('story-text').innerHTML = `<strong>【${title}】</strong><br>${desc}`;
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    optionsArray.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt.text}</span>`;
        btn.onclick = opt.action;
        optionsContainer.appendChild(btn);
    });
}
</script>
</body>
</html>
