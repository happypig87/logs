<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠畜模擬器 - 郵務人生擴充版</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        #game-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 800px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 13px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-weight: bold; font-size: 18px; margin-top: 4px; }
        .stat-desc { font-size: 11px; margin-top: 2px; }
        .rank-80 { color: #00e676; } .rank-70 { color: #8bc34a; } .rank-60 { color: #00bcd4; } .rank-50 { color: #ffeb3b; } .rank-40 { color: #ff9800; } .rank-20 { color: #f44336; }
        .finance-bar { display: flex; justify-content: space-between; background: #252525; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .phase-indicator { background: #2196f3; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        #story-text { font-size: 15px; line-height: 1.6; min-height: 80px; margin-bottom: 20px; background: #252525; padding: 15px; border-left: 4px solid #2196f3; border-radius: 4px; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        button.option-btn { background: #2c2c2c; color: #fff; border: 1px solid #444; padding: 14px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: left; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        button.option-btn:hover { background: #3a3a3a; border-color: #2196f3; transform: translateY(-2px); }
        .chance-badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; font-weight: bold; margin-left: 10px; white-space: nowrap; }
        .chance-high { background: #1b5e20; color: #81c784; } .chance-med { background: #e65100; color: #ffb74d; } .chance-low { background: #b71c1c; color: #e57373; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #bbb; }
        input[type="text"], select { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; box-sizing: border-box; }
        input[type="range"] { width: 100%; accent-color: #2196f3; }
        .start-btn { width: 100%; background: #2196f3; text-align: center; font-weight: bold; font-size: 18px; margin-top: 10px; padding: 14px; border: none; border-radius: 6px; color: #fff; cursor: pointer; }
        .start-btn:hover { background: #1976d2; }
        #log { margin-top: 20px; font-size: 13px; color: #aaa; max-height: 140px; overflow-y: auto; border-top: 1px solid #333; padding-top: 10px; line-height: 1.5; }
        .hidden { display: none !important; }
        .log-success { color: #81c784; } .log-fail { color: #e57373; }
        .age-warning { color: #f44336; font-size: 12px; margin-top: 4px; display: none; }
        .bad-habit-tag { background-color: #b71c1c; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-left: 8px; }
    </style>
</head>
<body>

<div id="game-card">
    <div id="setup-screen">
        <h2 style="margin-top:0; text-align:center;">📋 郵務人員入職登記</h2>
        <p style="color:#aaa; text-align:center; font-size:14px; margin-bottom: 25px;">恭喜你成為了一名新科郵務士，你的職階為專業職二-外勤。</p>
        
        <div class="form-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" placeholder="請輸入姓名" value="陳大天">
        </div>

        <div class="form-group">
            <label for="start-age">入職年齡：<span id="age-val" style="color:#ffeb3b; font-weight:bold; font-size:18px;">22</span> 歲</label>
            <input type="range" id="start-age" min="18" max="50" value="22" oninput="onAgeChange(this.value)">
            <div id="age-cap-tip" class="age-warning">⚠️ 入職年齡高於 40 歲：體力初始與最高上限受限為 60 分。</div>
        </div>

        <div class="form-group">
            <label for="dept-select">選擇分發部門：</label>
            <select id="dept-select">
                <option value="混投部門">混投部門 (平信/掛號/小包裹，無配發手機，機車投遞)</option>
                <option value="快包部門">快包部門 (大件包裹/急件快捷，配發公務手機，汽車投遞)</option>
            </select>
        </div>

        <button class="start-btn" onclick="startGame()">正式報到入職 (隨機五維素質)</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header">
            <div>
                <h2 style="margin:0; font-size: 20px;">
                    <span id="display-title">郵務士</span> <span id="display-name">陳大天</span>
                    <span id="bad-habit-display"></span>
                </h2>
                <span id="display-career" style="font-size:12px; color:#aaa;">年資第 1 年 | 部門：混投部門</span>
            </div>
            <div><span id="age" style="font-size: 22px; color:#ffeb3b;">18</span> 歲 (退休倒數 <span id="years-left">--</span> 年)</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">體力<span id="stamina" class="stat-val">50</span><span id="stamina-desc" class="stat-desc"></span></div>
            <div class="stat-box">情商<span id="eq" class="stat-val">50</span><span id="eq-desc" class="stat-desc"></span></div>
            <div class="stat-box">職場聲望<span id="reputation" class="stat-val">50</span><span id="reputation-desc" class="stat-desc"></span></div>
            <div class="stat-box">應變能力<span id="adaptability" class="stat-val">50</span><span id="adaptability-desc" class="stat-desc"></span></div>
            <div class="stat-box">工作評價<span id="performance" class="stat-val">50</span><span id="performance-desc" class="stat-desc"></span></div>
        </div>

        <div class="finance-bar">
            <div>本年薪資：<span id="salary-display" style="color:#ffc107; font-weight:bold;">76 萬</span></div>
            <div>累積淨資產：<span id="money" style="color:#4caf50; font-weight:bold;">$0 萬</span></div>
        </div>

        <div>
            <span id="phase-tag" class="phase-indicator">階段 1/3：投遞日常事件</span>
        </div>

        <div id="story-text">載入中...</div>
        <div id="options" class="options-container"></div>
        <div id="log">--- 履歷日誌 ---</div>
    </div>
</div>

<script>
let player = {
    name: "", title: "郵務士", dept: "混投部門", age: 18, startAge: 18, retireAge: 65,
    stamina: 50, eq: 50, reputation: 50, adaptability: 50, performance: 50,
    money: 0, maxStaminaCap: 80, currentPhase: 1, badHabit: null, badHabitExpense: 0,
    hasBeenProxyInspector: false, isInspector: false, refusedPromotion: false
};

const salaryTable = { 1: 76, 2: 84, 3: 86, 4: 88, 5: 90, 6: 94, 7: 94, 8: 99, 9: 101, 10: 103, 11: 106, 12: 107, 13: 109, 14: 110, 15: 111, 16: 113, 17: 115 };

function calculateSalary(serviceYear) {
    let salaryInWan = serviceYear <= 17 ? salaryTable[serviceYear] : ((serviceYear - 18) % 5 + 1 === 5 ? 128 : 121);
    if (player.isInspector) salaryInWan += 6;
    return { amount: salaryInWan * 10000, displayWan: salaryInWan };
}

function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function getScoutingReport(val) {
    if (val >= 80) return { class: 'rank-80', label: '頂尖巨星' };
    if (val >= 70) return { class: 'rank-70', label: '全明星' };
    if (val >= 60) return { class: 'rank-60', label: '高於平均' };
    if (val >= 50) return { class: 'rank-50', label: '聯盟平均' };
    if (val >= 40) return { class: 'rank-40', label: '低於平均' };
    return { class: 'rank-20', label: '顯低於平均' };
}

function onAgeChange(val) {
    document.getElementById('age-val').innerText = val;
    document.getElementById('age-cap-tip').style.display = parseInt(val) > 40 ? 'block' : 'none';
}

// 輔助函式：快速建立高/中/低三合理的選項
function createThreeOptions(opt1, opt2, opt3) {
    return [
        { text: "【高合理性】" + opt1.t, baseChance: 80, statCheck: opt1.s, success: opt1.sc, fail: opt1.fc },
        { text: "【中合理性】" + opt2.t, baseChance: 55, statCheck: opt2.s, success: opt2.sc, fail: opt2.fc },
        { text: "【低合理性】" + opt3.t, baseChance: 25, statCheck: opt3.s, success: opt3.sc, fail: opt3.fc }
    ];
}

// ================= 事件庫 (每類 20 個) =================
const eventDatabase = {
    // 類別 1: 投遞中遇到的問題
    delivery: [
        {
            title: "暴雨突襲與積水路段", desc: "午後突降狂風暴雨，前方路段積水嚴重，郵件有泡水風險...",
            options: createThreeOptions(
                { t: "暫避騎樓，套上防雨塑膠袋後等雨勢變小", s: "adaptability", sc: { effect: { adaptability: 3, performance: 2 }, log: "✅ 郵件完好無損，順利送達。" }, fc: { effect: { stamina: -2 }, log: "❌ 等雨過久，耽誤少許時間。" } },
                { t: "憑經驗繞道高勢巷弄繼續遞送", s: "stamina", sc: { effect: { stamina: -3, performance: 4 }, log: "✅ 繞過積水區，按時完成任務。" }, fc: { effect: { stamina: -6 }, log: "❌ 在巷弄迷路，體力白白消耗。" } },
                { t: "油門一催，直接衝過積水區域！", s: "adaptability", sc: { effect: { reputation: 6, performance: 6 }, log: "🎉 奇蹟衝過積水！被民眾稱為最強郵差。" }, fc: { effect: { money: -2000, performance: -5 }, log: "💥 機車進水熄火，部分包裹濕透。" } }
            )
        },
        {
            title: "無繫繩惡犬攔路", desc: "一隻大型猛犬衝出巷口對你狂吠，堵住去路...",
            options: createThreeOptions(
                { t: "保持冷靜不對視，用郵差包擋前面緩步退後", s: "eq", sc: { effect: { eq: 3, adaptability: 2 }, log: "✅ 犬隻見無威脅後自行退去。" }, fc: { effect: { stamina: -3 }, log: "❌ 被堵在巷口20分鐘，進度受阻。" } },
                { t: "掏出隨身肉乾試圖進行外交破冰", s: "eq", sc: { effect: { eq: 5, reputation: 3, money: -100 }, log: "✅ 肉乾收服成功，建立友好關係。" }, fc: { effect: { eq: -3, money: -100 }, log: "❌ 狗吃完肉乾繼續狂吠，無效。" } },
                { t: "拿防身棍大聲呵斥，硬生生逼退惡犬！", s: "stamina", sc: { effect: { reputation: 8, stamina: 2 }, log: "🎉 霸氣威壓！惡犬夾尾巴逃跑。" }, fc: { effect: { stamina: -10, money: -2000 }, log: "💥 被惡犬咬傷褲管，就醫打針。" } }
            )
        },
        {
            title: "死者掛號信件", desc: "收件人已於上個月過世，家屬情緒激動拒絕簽收...",
            options: createThreeOptions(
                { t: "耐心安撫情緒，說明退件規範並攜回處理", s: "eq", sc: { effect: { eq: 4, reputation: 3 }, log: "✅ 家屬體諒理解，依規順利退件。" }, fc: { effect: { eq: -2 }, log: "❌ 溝通時間過長，心情受影響。" } },
                { t: "請里長或鄰居協助勸導與見證簽收", s: "adaptability", sc: { effect: { adaptability: 4, reputation: 4 }, log: "✅ 里長協助順利解決退回手續。" }, fc: { effect: { reputation: -2 }, log: "❌ 里長不在，徒勞無功。" } },
                { t: "直接大聲跟家屬爭執法規條文", s: "eq", sc: { effect: { eq: 8, performance: 4 }, log: "🎉 用堅定氣勢壓制對方，依法攜回。" }, fc: { effect: { reputation: -8, performance: -6 }, log: "💥 被家屬檢舉態度惡劣，挨申訴。" } }
            )
        },
        {
            title: "舊街區超重包裹", desc: "舊公寓五樓無電梯，有20公斤重包裹需親送上樓...",
            options: createThreeOptions(
                { t: "分兩次搬運，扶著樓梯慢慢爬上樓", s: "stamina", sc: { effect: { stamina: -4, performance: 3 }, log: "✅ 順利送達，獲得住戶感謝。" }, fc: { effect: { stamina: -8 }, log: "❌ 體力透支，雙腿發軟。" } },
                { t: "打電話請住戶下樓一起幫忙抬上去", s: "eq", sc: { effect: { stamina: -2, eq: 3 }, log: "✅ 住戶熱心下樓一同搬運。" }, fc: { effect: { eq: -4 }, log: "❌ 住戶口氣不好，拒絕下樓。" } },
                { t: "一次把所有重物扛上肩，一口氣衝上五樓！", s: "stamina", sc: { effect: { stamina: -2, performance: 8 }, log: "🎉 驚人體力爆發！迅速完成送達。" }, fc: { effect: { stamina: -15, performance: -4 }, log: "💥 拉傷腰部，接下來幾天舉步維艱。" } }
            )
        },
        {
            title: "模糊不清的門牌地址", desc: "信件上的地址字跡被水沾濕模糊，無法辨識號碼...",
            options: createThreeOptions(
                { t: "攜回局裡用系統交叉比對住戶資料", s: "adaptability", sc: { effect: { adaptability: 4, performance: 2 }, log: "✅ 查出正確地址，明日成功投遞。" }, fc: { effect: { performance: -2 }, log: "❌ 查無此人，只能作廢退件。" } },
                { t: "詢問該巷口的柑仔店老老闆協助認人", s: "eq", sc: { effect: { eq: 4, reputation: 4 }, log: "✅ 老闆一眼認出是誰家的信件！" }, fc: { effect: { eq: -2 }, log: "❌ 老闆也不清楚，浪費時間。" } },
                { t: "憑直覺丟進看起來最像的那一戶門口", s: "adaptability", sc: { effect: { performance: 6 }, log: "🎉 瞎猜竟然猜中了！住戶無抱怨。" }, fc: { effect: { reputation: -8, performance: -8 }, log: "💥 投錯信箱引發住戶嚴重投訴。" } }
            )
        },
        {
            title: "高空拋物危險區域", desc: "經過某舊大樓下方，經常有住戶亂扔垃圾與雜物...",
            options: createThreeOptions(
                { t: "戴好安全帽，沿著騎樓遮雨棚快速通過", s: "adaptability", sc: { effect: { adaptability: 3, stamina: -1 }, log: "✅ 安全通過危險區域。" }, fc: { effect: { stamina: -3 }, log: "❌ 被濺出的垃圾水潑到。" } },
                { t: "連絡管委會反映此危險情況", s: "eq", sc: { effect: { reputation: 4, eq: 3 }, log: "✅ 管委會承諾加強貼告示改善。" }, fc: { effect: { eq: -3 }, log: "❌ 管委會互甩包袱不處理。" } },
                { t: "站在大樓下對著上方大聲開罵！", s: "stamina", sc: { effect: { reputation: 6 }, log: "🎉 氣勢凌人，住戶嚇得不敢再扔。" }, fc: { effect: { reputation: -6, eq: -4 }, log: "💥 被高空潑水伺候，狼狽不堪。" } }
            ]
        },
        {
            title: "繁華商業區無處停車", desc: "商業大樓周邊全部劃紅線，無任何合法停車空間...",
            options: createThreeOptions(
                { t: "停至付費停車場，再步行推車進大樓", s: "stamina", sc: { effect: { stamina: -3, money: -100, performance: 2 }, log: "✅ 多花錢但安全合規完成。" }, fc: { effect: { stamina: -6 }, log: "❌ 走路過遠耗費大量精力。" } },
                { t: "與大樓管理員溝通，借停地下室卸貨區", s: "eq", sc: { effect: { eq: 4, reputation: 4 }, log: "✅ 管理員熱情通融停靠。" }, fc: { effect: { eq: -3 }, log: "❌ 被管理員冷漠拒絕。" } },
                { t: "直接騎上人行道並把車停在大樓大門口！", s: "adaptability", sc: { effect: { performance: 6 }, log: "🎉 快速完成遞送且沒被檢舉。" }, fc: { effect: { money: -600, performance: -4 }, log: "💥 被路過警察開違規停車單。" } }
            ]
        },
        {
            title: "高溫酷暑發局警報", desc: "體感溫度高達40度，騎車路上感到頭暈目眩...",
            options: createThreeOptions(
                { t: "至超商購買運動飲料補充水分，稍作休息", s: "stamina", sc: { effect: { stamina: 3, money: -50 }, log: "✅ 體力恢復，避免中暑。" }, fc: { effect: { stamina: -2, money: -50 }, log: "❌ 休息時間過長，稍微延誤。" } },
                { t: "調整路線，優先遞送遮陰較多的樹蔭巷弄", s: "adaptability", sc: { effect: { adaptability: 4, stamina: 1 }, log: "✅ 路線安排得當，順利降溫。" }, fc: { effect: { stamina: -4 }, log: "❌ 繞路反而多曬了太陽。" } },
                { t: "無視身體警訊，一口氣衝完所有信件！", s: "stamina", sc: { effect: { performance: 8 }, log: "🎉 鋼鐵意志！提早完成本日遞送。" }, fc: { effect: { stamina: -15, performance: -5 }, log: "💥 嚴重中暑刮痧，被迫請假。" } }
            ]
        },
        {
            title: "郵務機車鏈條脫落", desc: "半路機車傳出異音，鏈條鬆脫卡死在路邊...",
            options: createThreeOptions(
                { t: "推車至附近特約機車行進行檢修", s: "adaptability", sc: { effect: { adaptability: 3, stamina: -2 }, log: "✅ 車行快速修復，重返崗位。" }, fc: { effect: { stamina: -6 }, log: "❌ 車行客滿，等待許久。" } },
                { t: "掏出隨車工具箱嘗試自己動手接回鏈條", s: "adaptability", sc: { effect: { adaptability: 6, stamina: -1 }, log: "✅ 展現黑手技能，5分鐘搞定！" }, fc: { effect: { stamina: -4, eq: -3 }, log: "❌ 弄得雙手黑漆漆還沒修好。" } },
                { t: "不管機車，硬扛著郵包徒步繼續送完！", s: "stamina", sc: { effect: { stamina: -5, reputation: 8 }, log: "🎉 敬業精神感動附近店家！" }, fc: { effect: { stamina: -18, performance: -6 }, log: "💥 體力透支，包裹受損。" } }
            ]
        },
        {
            title: "住戶爭執郵件損壞", desc: "住戶聲稱信件封面有摺痕，當場怒罵並拒簽...",
            options: createThreeOptions(

// ================= 遊戲核心邏輯 =================

function startGame() {
    let nameInput = document.getElementById('player-name').value.trim();
    if (!nameInput) { alert("請輸入姓名！"); return; }
    
    player.name = nameInput;
    player.startAge = parseInt(document.getElementById('start-age').value);
    player.age = player.startAge;
    player.dept = document.getElementById('dept-select').value;
    
    player.eq = getRandomInt(20, 80);
    player.reputation = getRandomInt(20, 80);
    player.adaptability = getRandomInt(20, 80);
    player.performance = getRandomInt(20, 80);

    if (player.startAge > 40) {
        player.maxStaminaCap = 60;
        player.stamina = getRandomInt(20, 60);
    } else {
        player.maxStaminaCap = 80;
        player.stamina = getRandomInt(20, 80);
    }

    let rand = Math.random();
    if (rand < 0.30) {
        player.badHabit = "抽菸";
        player.badHabitExpense = 36000;
        player.stamina = Math.max(20, player.stamina - 5);
    } else if (rand < 0.40) {
        player.badHabit = "吃檳榔";
        player.badHabitExpense = 60000;
        player.stamina = Math.max(20, player.stamina - 8);
    }

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    updateUI();
    addLog(`📋 ${player.name} 正式報到入職，分發至【${player.dept}】！`, true);
    addLog(`📊 體檢生成 (20-80 棒球量尺)：體力${player.stamina} / 情商${player.eq} / 聲望${player.reputation} / 應變${player.adaptability} / 評價${player.performance}`, true);

    if (player.badHabit) {
        addLog(`⚠️ 發現不良嗜好：【${player.badHabit}】(每年額外支出 $${player.badHabitExpense/10000} 萬)`, false);
    }

    startYearTurn();
}

function updateUI() {
    document.getElementById('display-name').innerText = player.name;
    document.getElementById('display-title').innerText = player.title;
    document.getElementById('display-career').innerText = `年資第 ${player.age - player.startAge + 1} 年 | 部門：${player.dept}`;
    document.getElementById('age').innerText = player.age;
    document.getElementById('years-left').innerText = player.retireAge - player.age;
    document.getElementById('money').innerText = `$${(player.money / 10000).toFixed(1)} 萬`;

    let habitDisplay = document.getElementById('bad-habit-display');
    habitDisplay.innerHTML = player.badHabit ? `<span class="bad-habit-tag">${player.badHabit}</span>` : "";

    let salInfo = calculateSalary(player.age - player.startAge + 1);
    document.getElementById('salary-display').innerText = `${salInfo.displayWan} 萬`;

    ['stamina', 'eq', 'reputation', 'adaptability', 'performance'].forEach(stat => {
        const valEl = document.getElementById(stat);
        const descEl = document.getElementById(`${stat}-desc`);
        let val = player[stat];
        let report = getScoutingReport(val);
        valEl.innerText = val;
        valEl.className = `stat-val ${report.class}`;
        descEl.innerText = report.label;
        descEl.className = `stat-desc ${report.class}`;
    });
}

function addLog(text, isSuccess = true) {
    const logBox = document.getElementById('log');
    const newEntry = document.createElement('div');
    newEntry.className = isSuccess ? 'log-success' : 'log-fail';
    newEntry.innerText = text;
    logBox.prepend(newEntry);
}

function checkGameOver() {
    if (player.stamina <= 0) {
        triggerEnding("失能殉職", `過勞殉職，體力歸零...`);
        return true;
    }
    if (player.eq <= 0 || player.reputation <= 0 || player.adaptability <= 0 || player.performance <= 0) {
        triggerEnding("解職處分", `五維能力過低，遭機構予以免職！`);
        return true;
    }
    if (player.age >= player.retireAge) {
        triggerEnding("榮退結局", `恭喜順利服役至 65 歲屆齡退休！`);
        return true;
    }
    return false;
}

function triggerEnding(endingType, reasonText) {
    let serviceYears = player.age - player.startAge + 1;
    let avgStat = Math.round((player.stamina + player.eq + player.reputation + player.adaptability + player.performance) / 5);
    let avgReport = getScoutingReport(avgStat);

    document.getElementById('options').innerHTML = '';
    document.getElementById('phase-tag').innerText = "遊戲結束";
    document.getElementById('story-text').innerHTML = `
        <h3 style="color:#ffeb3b; margin-top:0;">🏁 生涯結局：【${endingType}】</h3>
        <strong>${player.name} ${player.title}</strong><br>
        ${reasonText}<br><br>
        📌 最終生涯統計：<br>
        • 服役年資：${serviceYears} 年<br>
        • 最終職銜：${player.title}<br>
        • 累積淨資產：$${(player.money / 10000).toFixed(1)} 萬元<br>
        • 最終五維平均：<strong class="${avgReport.class}">${avgStat} 分 (${avgReport.label})</strong>
    `;
}

function startYearTurn() {
    if (checkGameOver()) return;

    let serviceYear = player.age - player.startAge + 1;
    let sal = calculateSalary(serviceYear).amount;
    let livingExpense = 150000;
    let extraExpense = player.badHabit ? player.badHabitExpense : 0;
    let netSavings = sal - livingExpense - extraExpense;
    player.money += netSavings;

    addLog(`📅 年資第 ${serviceYear} 年結算：年薪 $${sal/10000}萬，淨存入 $${netSavings/10000}萬。`);
    updateUI();

    player.currentPhase = 1;
    loadPhaseEvent();
}

function loadPhaseEvent() {
    if (checkGameOver()) return;

    document.getElementById('phase-tag').innerText = `階段 ${player.currentPhase}/3：${
        player.currentPhase === 1 ? '投遞中遇到的問題' : player.currentPhase === 2 ? '職場上與同事/上級互動' : '其他可能會遇到的事情'
    }`;

    let categoryKey = player.currentPhase === 1 ? 'delivery' : player.currentPhase === 2 ? 'workplace' : 'career';
    let pool = eventDatabase[categoryKey];
    let selectedEvent = pool[getRandomInt(0, pool.length - 1)];

    renderEvent(selectedEvent);
}

function renderEvent(evt) {
    document.getElementById('story-text').innerHTML = `<strong>【${evt.title}】</strong><br>${evt.desc}`;
    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    evt.options.forEach((opt) => {
        let chance = opt.baseChance;
        if (opt.statCheck) {
            chance += Math.round((player[opt.statCheck] - 50) * 0.5);
        }
        chance = Math.max(10, Math.min(95, chance));

        let badgeClass = chance >= 70 ? 'chance-high' : chance >= 40 ? 'chance-med' : 'chance-low';

        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
            <span>${opt.text}</span>
            <span class="chance-badge ${badgeClass}">成功率 ${chance}%</span>
        `;
        btn.onclick = () => handleOptionClick(opt, chance);
        optionsContainer.appendChild(btn);
    });
}

function handleOptionClick(opt, chance) {
    let isSuccess = Math.random() * 100 < chance;
    let result = isSuccess ? opt.success : opt.fail;

    if (result.effect) {
        for (let stat in result.effect) {
            if (stat === 'money') {
                player.money += result.effect[stat];
            } else {
                player[stat] += result.effect[stat];
                player[stat] = Math.max(0, Math.min(80, player[stat]));
                if (stat === 'stamina') player.stamina = Math.min(player.stamina, player.maxStaminaCap);
            }
        }
    }

    addLog(result.log, isSuccess);
    updateUI();

    if (checkGameOver()) return;

    if (player.currentPhase < 3) {
        player.currentPhase++;
        loadPhaseEvent();
    } else {
        player.age++;
        startYearTurn();
    }
}
</script>
</body>
</html>
